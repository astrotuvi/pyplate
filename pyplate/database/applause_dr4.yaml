- name: phot_calib
  timestamps: true
  primary_key: [calib_id]
  primary_key_name: calib_pky
  columns:
  - {name: calib_id, type: serial}
  - {name: process_id, type: int, unsigned: true, null: false, pgsql: "integer"}
  - {name: scan_id, type: int, unsigned: true, null: false, pgsql: "integer"}
  - {name: plate_id, type: int, unsigned: true, null: false, pgsql: "integer"}
  - {name: archive_id, type: int, unsigned: true, null: false, pgsql: "integer"}
  - {name: solution_num, type: smallint, unsigned: true}
  - {name: iteration, type: smallint, unsigned: true}
  - {name: color_term, type: real}
  - {name: color_term_error, type: real}
  - {name: cterm_stdev_fit, type: real}
  - {name: cterm_stdev_min, type: real}
  - {name: cterm_range_min, type: real}
  - {name: cterm_range_max, type: real}
  - {name: cterm_iterations, type: tinyint, unsigned: true}
  - {name: cterm_num_stars, type: int, unsigned: true}
  - {name: num_gaia_edr3, type: int, unsigned: true}
  - {name: num_candidate_stars, type: int, unsigned: true}
  - {name: num_calib_stars, type: int, unsigned: true}
  - {name: num_bright_stars, type: int, unsigned: true}
  - {name: num_outliers, type: int, unsigned: true}
  - {name: bright_limit, type: real}
  - {name: faint_limit, type: real}
  - {name: mag_range, type: real}
  - {name: rmse_min, type: real}
  - {name: rmse_median, type: real}
  - {name: rmse_max, type: real}
  - {name: plate_mag_brightest, type: real}
  - {name: plate_mag_density02, type: real}
  - {name: plate_mag_brightcut, type: real}
  - {name: plate_mag_maxden, type: real}
  - {name: plate_mag_lim, type: real}
  indexes:
  - {name: process_ind, columns: [process_id]}
  - {name: scan_ind, columns: [scan_id]}
  - {name: plate_ind, columns: [plate_id]}
  - {name: archive_ind, columns: [archive_id]}

- name: phot_calib_curve
  timestamps: true
  primary_key: [calibcurve_id]
  primary_key_name: calibcurve_pky
  columns:
  - {name: calibcurve_id, type: serial}
  - {name: calib_id, type: int, unsigned: true, null: false, pgsql: "integer"}
  - {name: process_id, type: int, unsigned: true, null: false, pgsql: "integer"}
  - {name: scan_id, type: int, unsigned: true, null: false, pgsql: "integer"}
  - {name: plate_id, type: int, unsigned: true, null: false, pgsql: "integer"}
  - {name: archive_id, type: int, unsigned: true, null: false, pgsql: "integer"}
  - {name: solution_num, type: smallint, unsigned: true}
  - {name: iteration, type: smallint, unsigned: true}
  - {name: plate_mag, type: real}
  - {name: natmag, type: real}
  indexes:
  - {name: calib_ind, columns: [calib_id]}
  - {name: process_ind, columns: [process_id]}
  - {name: scan_ind, columns: [scan_id]}
  - {name: plate_ind, columns: [plate_id]}
  - {name: archive_ind, columns: [archive_id]}

- name: process
  primary_key: [process_id]
  columns:
  - {name: process_id, type: serial}
  - {name: scan_id, type: int, unsigned: true}
  - {name: plate_id, type: int, unsigned: true}
  - {name: archive_id, type: int, unsigned: true}
  - {name: filename, type: varchar(255)}
  - {name: num_exposures, type: smallint, unsigned: true}
  - {name: plate_epoch, type: real}
  - {name: hostname, type: varchar(80)}
  - {name: timestamp_start, type: timestamp, default: now}
  - {name: timestamp_end, type: timestamp, pgsql: "timestamp with time zone default null"}
  - {name: duration, type: int, unsigned: true}
  - {name: sky, type: real}
  - {name: sky_sigma, type: real}
  - {name: use_psf, type: bool, unsigned: true}
  - {name: threshold, type: real}
  - {name: num_sources, type: int, unsigned: true}
  - {name: num_psf_sources, type: int, unsigned: true}
  - {name: num_true_sources, type: int, unsigned: true}
  - {name: num_artifacts, type: int, unsigned: true}
  - {name: solved, type: bool, unsigned: true}
  - {name: num_solutions, type: smallint, unsigned: true}
  - {name: pattern_ratio, type: real}
  - {name: num_gaia_edr3, type: int, unsigned: true}
  - {name: color_term, type: real}
  - {name: bright_limit, type: real}
  - {name: faint_limit, type: real}
  - {name: mag_range, type: real}
  - {name: num_calib, type: int, unsigned: true}
  - {name: num_iterations, type: smallint, unsigned: true}
  - {name: calibrated, type: bool, unsigned: true}
  - {name: completed, type: bool, unsigned: true}
  - {name: pyplate_version, type: varchar(15)}
  indexes:
  - {name: scan_ind, columns: [scan_id]}
  - {name: plate_ind, columns: [plate_id]}
  - {name: archive_ind, columns: [archive_id]}
  - {name: filename_ind, columns: [filename]}

- name: process_log
  primary_key: [processlog_id]
  primary_key_name: processlog_pky
  columns:
  - {name: processlog_id, type: serial}
  - {name: process_id, type: int, unsigned: true, null: false}
  - {name: timestamp_log, type: timestamp, default: now, null: false}
  - {name: scan_id, type: int, unsigned: true}
  - {name: plate_id, type: int, unsigned: true}
  - {name: archive_id, type: int, unsigned: true}
  - {name: level, type: tinyint}
  - {name: event, type: smallint}
  - {name: solution_num, type: smallint, unsigned: true}
  - {name: message, type: text}
  indexes:
  - {name: process_ind, columns: [process_id]}
  - {name: scan_ind, columns: [scan_id]}
  - {name: plate_ind, columns: [plate_id]}
  - {name: archive_ind, columns: [archive_id]}
  - {name: event_ind, columns: [event]}
