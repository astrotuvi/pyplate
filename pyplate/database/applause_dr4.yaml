# APPLAUSE DR4 schema in the backend-neutral format (DESIGN.md, section 5.3),
# converted from the DR4 schema of the old code. It is kept to check that
# the generated SQL equals the SQL of the old code (tests/ver4/ddl); the code
# targets applause_dr5.yaml.
#
# The keys pgsql and mysql give the full column definition for one backend,
# where the DR4 tables differ from the definition generated from the type.

schema: applause_dr4

tables:

