# Configuration of the reference-plate run (see tests/ver4/README.md,
# section "Reference plates"). Based on the DR5 development configuration,
# without paths: all directories and program paths are in paths.local, which
# is not in the repository (template: paths.local.example).
#
# Differences from the development configuration: output_header_fits is off
# (the old code would call PlateDB.update_scan() without a database);
# output_sources_csv is off (run_reference_plates.py saves the full source
# table); the [DB_pgsql] section is left out (the run uses a recording
# database instead).

[Archive]
archive_id = 0

[Pipeline]
read_wfpdb = False
read_csv = True
read_fits = False
output_header_file = True
output_header_fits = False
invert_image = True
extract_sources = True
classify_artifacts = True
solve_plate = True
output_solution_db = True
output_wcs_file = True
crossmatch_gaia = True
calibrate_photometry = True
output_calibration_db = True
output_sources_db = False
output_sources_csv = False
processes = 1
process_max_tasks = 10
wait_start = 10

[Solve]
use_filter = True
threshold_sigma = 3
use_psf = False
psf_threshold_sigma = 15
psf_model_sigma = 15
plate_epoch = 1970
crossmatch_nsigma = 10
crossmatch_nlogarea = 2
crossmatch_maxradius = 20
repeat_find = True

[Catalog]
catalog = Gaia
protocol = TAP

[Database]
use_gaia_fits = True
use_tycho2_fits = False
dr_num = 5
process_num_digits = 6
source_num_digits = 7

[Files]
plate_csv = plate_archive_hamburger_sternwarte_LA_20171128_updated.csv,parsed_LA_UID_times.csv
scan_csv = LA_scans.csv
logbook_csv = LA_logbooks.csv
logpage_csv = LA_logpages.csv
preview_csv = LA_previews.csv
create_checksum = True

[plate_archive_hamburger_sternwarte_LA_20171128_updated.csv]
csv_delimiter = ;
csv_quotechar = "
csv_list_delimiter = |
plate_num = 1
wfpdb_id = 2
ra_orig = 5
dec_orig = 7
object_name = 9
date_orig = 11
plate_format = 13
skycond = 14
numexp = 15
exptime = 18
emulsion = 19
filter = 21
observer = 22
notes = 23
fn_pre = 25
fn_cover = 26
fn_scan = 33
fn_log = 29
sky_transparency = 34
sky_calmness = 35
sky_sharpness = 36
ota_name = 37
ota_diameter = 38
ota_aperture = 39
ota_foclen = 40
ota_scale = 41
prism = 42
prism_angle = 43
method_code = 44
method = 45
plate_size1 = 46
plate_size2 = 47

[parsed_LA_UID_times.csv]
csv_delimiter = ,
csv_quotechar = "
csv_list_delimiter = ;
