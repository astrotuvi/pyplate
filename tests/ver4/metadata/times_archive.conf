# Old-format (DR4) configuration for times_plates.csv: start and end times
# given as UT or sidereal time in their own columns, local time zones, and
# times after midnight with evening_date. csv_dir is set by
# gen_metadata_regression.py.

[Archive]
archive_id = 97
archive_name = Times mock archive

[Files]
plate_csv = times_plates.csv

[Metadata]
evening_date = true

[times_plates.csv]
csv_list_delimiter = ;
plate_id = 1
date_orig = 2
tms_orig = 3
tme_orig = 4
ut_start_orig = 5
ut_end_orig = 6
st_start_orig = 7
st_end_orig = 8
tz_orig = 9
exptime = 10
numexp = 11

[Keyword values]
observatory = Mock Observatory
site_name = Mock Hill
site_longitude = 26.72
site_latitude = 58.27
site_elevation = 70
