# Old-format (DR4) configuration for the "full" mock archive: WFPDB
# maindata, quality, notes and observer files; plate, scan, preview and
# logpage CSV files; FITS files and images; logbooks from configuration
# sections; keyword lookup. The directories are set by
# gen_metadata_regression.py.

[Archive]
archive_id = 98
archive_name = Full mock archive
logbooks = LB1, LB2

[LB1]
logbook_id = 0
logbook_num = 1
logbook_title = Mock journal I
logbook_type = 1
logbook_notes = First journal

[LB2]
logbook_num = 2
logbook_title = Mock journal II
logbook_type = 1

[Files]
wfpdb_maindata = MCKmaindata.txt
wfpdb_quality = MCKquality.txt
wfpdb_notes = MCKnotes.txt
wfpdb_observer = MCKobserver.txt
plate_csv = full_plates.csv
scan_csv = full_scans.csv
preview_csv = full_previews.csv
logpage_csv = full_logpages.csv

[WFPDB]
maindata_timezone = UT
notes_timezone = UT

[Metadata]
evening_date = true

[Image]
logpage_exif_timezone = Europe/Tallinn

[full_plates.csv]
csv_list_delimiter = ;
plate_id = 1
fn_cover = 2
fn_log = 3
series = 4

[full_scans.csv]
filename = 1
plate_id = 2
scan_author = 3
datescan = 4

[full_previews.csv]
plate_id = 2
preview_type = 3

[full_logpages.csv]
logbook_num = 2
page_num = 3
logpage_order = 4
logpage_type = 5

[Keyword values]
observatory = Mock Observatory
site_name = Mock Hill
site_longitude = 26.72
site_latitude = 58.27
site_elevation = 70

[Keyword lookup]
observer = true

[observer]
j. mets = Jaan Mets
