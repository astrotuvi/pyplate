# Old-format (DR4) configuration for mock_plates.csv.
# csv_dir is set by gen_metadata_regression.py.
# Plates m1-m5 cover the numexp rules in DESIGN.md section 4.3; m6 has two
# exposures with coordinates, the second with two sub-exposures.

[Archive]
archive_id = 99
archive_name = Mock archive

[Files]
plate_csv = mock_plates.csv

[Metadata]
evening_date = true

[mock_plates.csv]
csv_list_delimiter = ;
csv_timezone = UT
plate_id = 1
date_orig = 2
tms_orig = 3
tme_orig = 4
numexp = 5
exptime = 6
ra_orig = 7
dec_orig = 8
object_name = 9
object_type_code = 10
method_code = 11

[Keyword values]
observatory = Mock Observatory
site_name = Mock Hill
site_longitude = 26.72
site_latitude = 58.27
site_elevation = 70
